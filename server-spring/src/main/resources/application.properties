spring.application.name=server-spring


server.port=9000

# H2 Database Configuration (In-Memory, zero setup required)
spring.datasource.url=jdbc:h2:mem:finsight_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

